<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Presupuesto - DOM</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <article class="tarjeta">
        <h1>Control de Presupuesto</h1>
        <p class="descripcion">Define tu presupuesto inicial y agrega tus gastos.</p>

        <div class="formulario">
            <input id="presupuesto" type="number" step="any" placeholder="Agrega tu presupuesto inicial">
            <input id="nombreGasto" type="text" placeholder="Agrega nombre del gasto">
            <input id="precioGasto" type="number" step="any" placeholder="Agrega valor numerico del gasto">
            <button id="boton" type="button">Agregar gasto</button>
        </div>

        <ul id="lista"></ul>

        <div class="resumen">
            <p id="totalPresupuesto"></p>
            <p id="totalGasto"></p>
            <p id="dineroRestante"></p>
            <p id="alertaPresupuesto"></p>
        </div>
    </article>

    <script src="js/app.js"></script>
</body>
</html>
