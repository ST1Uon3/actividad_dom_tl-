<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Productos - DOM</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

    <article class="tarjeta">
        <h1>Lista de Productos</h1>
        <p class="descripcion">Escribe un producto y presiona agregar para sumarlo a la lista.</p>

        <div class="controles">
            <input type="text" name="" id="producto" placeholder="Escribe un producto..." />
            <button id="boton" type="button">Agregar</button>
        </div>

        <ul id="lista"></ul>

        <p id="aviso"></p>
    </article>

    <script src="js/app.js"></script>
</body>
</html>
