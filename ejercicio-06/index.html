<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

    <article class="tarjeta">
        <h1>Calculadora de IMC</h1>
        <p class="descripcion">Ingresa tu peso y estatura para calcular tu índice de masa corporal.</p>

        <div class="formulario">
            <input id="peso" type="number" step="any" placeholder="Ingresa tu peso corporal" required />
            <input id="estatura" type="number" step="any" placeholder="Ingresa tu estatura" required />
            <button id="boton" type="button">Calcular IMC</button>
        </div>

        <p id="resultado"></p>
    </article>

    <script src="js/app.js"></script>
</body>
</html>
