<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Tabla de Multiplicar - DOM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <article class="tarjeta">
        <h1>Tabla de Multiplicar</h1>
        <p class="descripcion">Ingresa un número y presiona el botón para generar su tabla.</p>

        <div class="controles">
            <input id="numero" type="number" placeholder="Ingresa un numero">
            <button id="boton" type="button" class="btn btn-primary">Generar Tabla</button>
        </div>

        <div class="tabla-wrapper">
            <table id="resultado" class="table">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </article>

    <script src="js/app.js"></script>
</body>

</html>
