<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Perfil - DOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="tarjeta-contenedor">
        <div class="card perfil-card">
            <div class="img-wrapper">
                <img src="../img/luna.jpeg" id="nuevaImagen" class="card-img-top" alt="...">
            </div>
            <div class="card-body">
                <h5 id="nuevoNombre" class="card-title">Nombre: luna</h5>
                <p id="nuevaProfesion" class="card-text">Profesion: Satelite Natural</p>
            </div>
        </div>

        <div class="campos">
            <input type="text" id="nombre" placeholder="ingresa tu nombre">
            <input type="text" id="profesion" placeholder="ingresa tu profesion">
            <input type="text" id="imagen" placeholder="ingresa tu imagen">
        </div>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
