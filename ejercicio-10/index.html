<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semáforo Interactivo - DOM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <article class="tarjeta">
        <h1>Semáforo</h1>
        <p class="descripcion">Presiona un botón para activar la luz y ver el estado.</p>

        <div class="semaforo-caja">
            <div id="circuloVerde" class="circulo"></div>
            <div id="circuloAmarillo" class="circulo"></div>
            <div id="circuloRojo" class="circulo"></div>
        </div>

        <div class="controles">
            <button type="button" id="botonVerde" class="btn btn-success">Verde</button>
            <button type="button" id="botonAmarillo" class="btn btn-warning">Amarillo</button>
            <button type="button" id="botonRojo" class="btn btn-danger">Rojo</button>
        </div>

        <div class="mensajes">
            <p id="puedesAvanzar"></p>
            <p id="precaucion"></p>
            <p id="detente"></p>
        </div>
    </article>

    <script src="js/app.js"></script>
</body>

</html>
