<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Color de Tarjeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="card color-card">
        <div class="card-body">
            <h5 class="card-title">Cambiar Fondo de la Tarjeta</h5>
            <p class="card-text">Selecciona un color del menú desplegable y el fondo de esta tarjeta cambiará al color que elijas.</p>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton1"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    Select
                </button>
                <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                    <li id="azul"><a class="dropdown-item" href="#">azul</a></li>
                    <li id="verde"><a class="dropdown-item" href="#">verde</a></li>
                    <li id="amarillo"><a class="dropdown-item" href="#">amarillo</a></li>
                    <li id="rosa"><a class="dropdown-item" href="#">rosa</a></li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
