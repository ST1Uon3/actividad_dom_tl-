<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Registro - DOM</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

    <article class="tarjeta">
        <h1>Registro</h1>
        <p class="descripcion">Completa tus datos para registrarte.</p>

        <form id="formulario" action="">
            <div class="campo">
                <input id="nombre" type="text" placeholder="ingresa tu nombre">
                <p id="avisoNombre" class="aviso"></p>
            </div>

            <div class="campo">
                <input id="correo" type="email" placeholder="ingrea tu correo electronico">
                <p id="avisoCorreo" class="aviso"></p>
            </div>

            <div class="campo">
                <input id="edad" type="number" placeholder="ingresa tu edad">
                <p id="avisoEdad" class="aviso"></p>
            </div>

            <button id="boton" type="submit">Registrarme</button>
        </form>

        <p id="mensajeExito"></p>
    </article>

    <script src="js/app.js"></script>
</body>
</html>
