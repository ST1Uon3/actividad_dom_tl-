<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas por Prioridad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <article class="tarjeta">
        <h1>Gestor de Tareas</h1>
        <p class="descripcion">Ingresa una tarea y su nivel de prioridad</p>

        <div class="formulario-tarea">
            <input id="tarea" type="text" placeholder="Ingresa una tarea">
            <select id="selector">
                <option>Baja</option>
                <option>Media</option>
                <option>Alta</option>
            </select>
        </div>

        <div class="acciones-principales">
            <button id="boton" type="button">Agregar Tarea</button>
            <button id="botonEliminar" type="button">Eliminar Tarea</button>
        </div>

        <div id="filtros">
            <button id="filtroTodas" type="button">Todas</button>
            <button id="filtroPendientes" type="button">Pendientes</button>
            <button id="filtroCompletadas" type="button">Completadas</button>
        </div>

        <ul id="listaTareas"></ul>

        <p id="tareasPendientes"></p>
    </article>

    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
